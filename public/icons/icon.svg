<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Clean white squircle with generous negative space -->
  <rect x="4" y="4" width="120" height="120" rx="34" ry="34" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <!-- Elegant, rounded bookmark ribbon in amber gold with ample margin/breathing room -->
  <g filter="url(#soft-shadow)">
    <path d="M46 36 C46 32, 49 30, 53 30 L75 30 C79 30, 82 32, 82 36 L82 88 C82 92, 77 94, 74 92 L64 83.5 L54 92 C51 94, 46 92, 46 88 Z" fill="url(#ribbon)"/>
