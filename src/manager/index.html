<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keepding</title>
  <link rel="stylesheet" href="./manager.css">
</head>
<body class="bg-[#fafafa] text-zinc-900 min-h-screen flex flex-col antialiased selection:bg-zinc-200">
  <!-- Top Navigation -->
  <header class="bg-white/80 backdrop-blur-md border-b border-zinc-200/80 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <!-- Logo -->
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-6 h-6 rounded-md bg-white border border-zinc-200 flex items-center justify-center shadow-2xs">
          <svg class="w-3.5 h-3.5 text-amber-500" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 4a2 2 0 012-2h10a2 2 0 012 2v18l-7-3.5L5 22V4z"/>
          </svg>
        </div>
        <span class="font-semibold text-sm tracking-tight text-zinc-900">Keepding</span>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-xl relative">
        <div class="relative flex items-center">
          <svg class="w-3.5 h-3.5 absolute left-3 text-zinc-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            type="text"
            id="search-input"
            class="w-full pl-8 pr-14 py-1.5 text-xs bg-zinc-100/80 border border-transparent rounded-lg placeholder:text-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-300 focus:ring-2 focus:ring-zinc-100 transition-all"
            placeholder="Search memos, notes, URLs, #tags..."
          >
          <div class="absolute right-2 flex items-center gap-1">
            <button id="btn-clear-search" class="hidden text-zinc-400 hover:text-zinc-600 p-0.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <kbd class="hidden sm:inline-block px-1 py-0.2 text-[10px] font-mono text-zinc-400 bg-white border border-zinc-200 rounded shadow-2xs">/</kbd>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 shrink-0">
        <button
          id="btn-lang"
          type="button"
          class="text-[11px] font-mono text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 px-2 py-1 rounded-lg border border-zinc-200 transition-colors"
        >
          EN
        </button>

        <button
          id="btn-open-io-modal"
          title="Backup & Import"
          class="p-1.5 text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 rounded-lg transition-colors border border-zinc-200/80"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Workspace -->
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 w-full flex-1 flex gap-8">
    <!-- Sidebar -->
    <aside class="w-48 shrink-0 hidden md:flex flex-col gap-6">
      <nav class="flex flex-col gap-0.5 text-xs font-medium">
        <button data-filter="all" class="sidebar-nav-item active flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-zinc-200/60 text-zinc-900 transition-colors">
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            <span id="nav-text-all">All Memos</span>
          </div>
          <span id="count-all" class="text-[11px] text-zinc-500 font-mono">0</span>
        </button>

        <button data-filter="notes" class="sidebar-nav-item flex items-center justify-between px-2.5 py-1.5 rounded-lg text-zinc-600 hover:bg-zinc-100 transition-colors">
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            <span id="nav-text-notes">Notes & Quotes</span>
          </div>
          <span id="count-notes" class="text-[11px] text-zinc-400 font-mono">0</span>
        </button>

        <button data-filter="images" class="sidebar-nav-item flex items-center justify-between px-2.5 py-1.5 rounded-lg text-zinc-600 hover:bg-zinc-100 transition-colors">
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span id="nav-text-images">Images</span>
          </div>
          <span id="count-images" class="text-[11px] text-zinc-400 font-mono">0</span>
        </button>

        <button data-filter="unread" class="sidebar-nav-item flex items-center justify-between px-2.5 py-1.5 rounded-lg text-zinc-600 hover:bg-zinc-100 transition-colors">
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="nav-text-unread">Read Later</span>
          </div>
          <span id="count-unread" class="text-[11px] text-zinc-400 font-mono">0</span>
        </button>

        <button data-filter="archived" class="sidebar-nav-item flex items-center justify-between px-2.5 py-1.5 rounded-lg text-zinc-600 hover:bg-zinc-100 transition-colors">
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
            </svg>
            <span id="nav-text-archived">Archive</span>
          </div>
          <span id="count-archived" class="text-[11px] text-zinc-400 font-mono">0</span>
        </button>
      </nav>

      <!-- Tags -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between px-1">
          <span id="nav-text-tags" class="text-[11px] font-medium uppercase tracking-wider text-zinc-400">Tags</span>
          <button id="btn-clear-tags" class="hidden text-[11px] text-zinc-400 hover:text-zinc-700">Clear</button>
        </div>
        <div id="tags-list" class="flex flex-col gap-0.5 max-h-[calc(100vh-320px)] overflow-y-auto pr-1"></div>
      </div>
    </aside>

    <!-- Main Cards Flow -->
    <main class="flex-1 min-w-0 flex flex-col gap-4">
      <!-- Quick Compose Box -->
      <div class="bg-white rounded-xl border border-zinc-200/80 shadow-2xs p-3 transition-all focus-within:border-zinc-400 focus-within:shadow-xs" id="quick-compose">
        <div id="compose-collapsed" class="flex items-center gap-2 cursor-text text-zinc-400 text-xs py-1 px-1">
          <svg class="w-4 h-4 text-zinc-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          <span id="quick-compose-text">Take a note, thought, or paste link/image...</span>
        </div>

        <form id="compose-form" class="hidden flex flex-col gap-2.5 pt-1">
          <textarea
            id="quick-notes"
            rows="3"
            placeholder="Write notes, quotes, or paste image ![](url)..."
            class="w-full text-xs text-zinc-900 placeholder:text-zinc-400 focus:outline-none resize-none font-mono"
          ></textarea>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 border-t border-zinc-100">
            <input
              type="text"
              id="quick-title"
              placeholder="Title (optional)"
              class="px-2.5 py-1 text-xs text-zinc-800 bg-zinc-50 border border-zinc-200 rounded-md focus:bg-white focus:outline-none focus:border-zinc-300"
            >
            <input
              type="url"
              id="quick-url"
              placeholder="Source URL https:// (optional)"
              class="px-2.5 py-1 text-xs text-zinc-800 bg-zinc-50 border border-zinc-200 rounded-md focus:bg-white focus:outline-none focus:border-zinc-300 font-mono"
            >
          </div>

          <div class="flex items-center justify-between pt-1 text-xs">
            <input
              type="text"
              id="quick-tags"
              placeholder="Tags (space separated)"
              class="flex-1 max-w-xs px-2 py-0.5 text-xs text-zinc-700 bg-transparent focus:outline-none"
            >

            <div class="flex items-center gap-2">
              <button type="button" id="btn-cancel-compose" class="px-2.5 py-1 text-xs text-zinc-500 hover:text-zinc-800 transition-colors">Cancel</button>
              <button type="submit" id="btn-submit-compose" class="px-3.5 py-1 text-xs font-medium text-white bg-zinc-900 hover:bg-zinc-800 rounded-lg shadow-xs transition-all">Save</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Section Header -->
      <div class="flex items-center justify-between pb-1">
        <div class="flex items-center gap-2">
          <h1 id="view-title" class="text-xs font-semibold uppercase tracking-wider text-zinc-400">All</h1>
          <span id="view-count" class="text-[11px] text-zinc-400 font-mono">0</span>
        </div>

        <div id="active-tag-pills" class="flex flex-wrap gap-1 items-center"></div>

        <div class="flex items-center gap-2 text-xs">
          <button id="btn-layout-toggle" title="Toggle Layout" class="p-1 text-zinc-400 hover:text-zinc-800 rounded-md">
            <svg id="icon-layout-grid" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>

          <select id="sort-select" class="text-xs text-zinc-600 bg-transparent border-0 py-0.5 pl-1 pr-6 focus:ring-0 focus:outline-none cursor-pointer">
            <option value="date_desc">Recently updated</option>
            <option value="date_asc">Oldest first</option>
            <option value="title_asc">Title A-Z</option>
          </select>
        </div>
      </div>

      <!-- Cards Grid -->
      <div id="bookmarks-container" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 items-start"></div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-20">
        <p id="empty-state-text" class="text-xs text-zinc-400 font-medium">No items found</p>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="bookmark-modal" class="fixed inset-0 z-50 hidden bg-black/20 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl border border-zinc-200/80 max-w-lg w-full overflow-hidden animate-in fade-in zoom-in-95 duration-100">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-zinc-100">
        <h2 id="modal-title" class="text-xs font-semibold text-zinc-900">Edit Card</h2>
        <button id="btn-close-modal" class="text-zinc-400 hover:text-zinc-700 p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="modal-form" class="p-5 flex flex-col gap-3">
        <input type="hidden" id="modal-id">

        <div>
          <div class="flex items-center justify-between mb-1">
            <label id="modal-label-notes" class="block text-[11px] font-medium text-zinc-500" for="modal-notes">Notes (Markdown)</label>
            <button type="button" id="modal-toggle-preview" class="text-[11px] text-zinc-400 hover:text-zinc-700">Preview</button>
          </div>
          <div id="modal-notes-edit">
            <textarea id="modal-notes" rows="5" class="w-full px-3 py-2 text-xs font-mono text-zinc-900 border border-zinc-200 rounded-lg focus:border-zinc-400 focus:outline-none resize-none transition-colors" placeholder="Markdown notes, thoughts..."></textarea>
          </div>
          <div id="modal-notes-preview" class="hidden p-3 max-h-56 overflow-y-auto bg-zinc-50 border border-zinc-200 rounded-lg text-xs markdown-body"></div>
        </div>

        <div>
          <label id="modal-label-title" class="block text-[11px] font-medium text-zinc-500 mb-1" for="modal-bm-title">Title (optional)</label>
          <input type="text" id="modal-bm-title" class="w-full px-3 py-1.5 text-xs text-zinc-900 border border-zinc-200 rounded-lg focus:border-zinc-400 focus:outline-none transition-colors">
        </div>

        <div>
          <label id="modal-label-url" class="block text-[11px] font-medium text-zinc-500 mb-1" for="modal-url">Source URL (optional)</label>
          <input type="url" id="modal-url" class="w-full px-3 py-1.5 text-xs text-zinc-900 border border-zinc-200 rounded-lg focus:border-zinc-400 focus:outline-none transition-colors font-mono">
        </div>

        <div>
          <label id="modal-label-tags" class="block text-[11px] font-medium text-zinc-500 mb-1" for="modal-tags">Tags</label>
          <input type="text" id="modal-tags" class="w-full px-3 py-1.5 text-xs text-zinc-900 border border-zinc-200 rounded-lg focus:border-zinc-400 focus:outline-none transition-colors" placeholder="Tags separated by spaces">
          <div id="modal-tag-suggestions" class="flex flex-wrap gap-1 mt-1.5"></div>
        </div>

        <div class="flex items-center gap-5 pt-1 text-xs text-zinc-600">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="modal-pinned" class="rounded border-zinc-300 text-zinc-900 focus:ring-0 w-3.5 h-3.5 accent-zinc-900">
            <span id="modal-label-pin">Pinned</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="modal-unread" class="rounded border-zinc-300 text-zinc-900 focus:ring-0 w-3.5 h-3.5 accent-zinc-900">
            <span id="modal-label-unread">Read later</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="modal-archived" class="rounded border-zinc-300 text-zinc-900 focus:ring-0 w-3.5 h-3.5 accent-zinc-900">
            <span id="modal-label-archived">Archive</span>
          </label>
        </div>

        <div class="pt-3 border-t border-zinc-100 flex items-center justify-end gap-2">
          <button type="button" id="btn-cancel-modal" class="px-3 py-1.5 text-xs text-zinc-600 hover:text-zinc-900 rounded-lg transition-colors">Cancel</button>
          <button type="submit" id="btn-submit-modal" class="px-3.5 py-1.5 text-xs font-medium text-white bg-zinc-900 hover:bg-zinc-800 rounded-lg shadow-xs transition-colors">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Import / Export Modal -->
  <div id="io-modal" class="fixed inset-0 z-50 hidden bg-black/20 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl border border-zinc-200/80 max-w-md w-full overflow-hidden animate-in fade-in zoom-in-95 duration-100">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-zinc-100">
        <h2 id="io-title" class="text-xs font-semibold text-zinc-900">Backup & Import</h2>
        <button id="btn-close-io" class="text-zinc-400 hover:text-zinc-700 p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-5 flex flex-col gap-5">
        <div class="space-y-2">
          <div id="io-export-heading" class="text-[11px] font-medium uppercase tracking-wider text-zinc-400">Export Backup</div>
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-export-json" class="p-2.5 text-left border border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 rounded-lg transition-colors">
              <div id="io-json-title" class="text-xs font-medium text-zinc-900">JSON Backup</div>
              <div id="io-json-desc" class="text-[10px] text-zinc-400 mt-0.5">Full notes, images and metadata</div>
            </button>
            <button id="btn-export-html" class="p-2.5 text-left border border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 rounded-lg transition-colors">
              <div id="io-html-title" class="text-xs font-medium text-zinc-900">HTML Bookmarks</div>
              <div id="io-html-desc" class="text-[10px] text-zinc-400 mt-0.5">Compatible with browsers</div>
            </button>
          </div>
        </div>

        <div class="space-y-2">
          <div id="io-import-heading" class="text-[11px] font-medium uppercase tracking-wider text-zinc-400">Import Data</div>
          <label class="flex items-center gap-1.5 text-xs text-zinc-600 mb-2 cursor-pointer">
            <input type="checkbox" id="import-overwrite" class="rounded border-zinc-300 text-zinc-900 focus:ring-0 w-3.5 h-3.5 accent-zinc-900">
            <span id="io-overwrite-label">Overwrite duplicate URLs</span>
          </label>

          <div id="drop-zone" class="border border-dashed border-zinc-200 hover:border-zinc-400 rounded-lg p-5 text-center cursor-pointer bg-zinc-50/50 hover:bg-zinc-50 transition-colors">
            <input type="file" id="file-import" accept=".json,.html,.htm" class="hidden">
            <svg class="w-5 h-5 mx-auto text-zinc-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <div id="io-drop-title" class="text-xs font-medium text-zinc-700">Choose file or drag here</div>
            <div id="io-drop-hint" class="text-[10px] text-zinc-400 mt-0.5">Supports .json or .html</div>
          </div>
          <div id="import-result" class="hidden text-xs p-2.5 rounded-lg"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-3 py-1.5 rounded-lg shadow-md text-xs font-medium text-white bg-zinc-900 transition-all"></div>

  <script type="module" src="./manager.ts"></script>
</body>
</html>
