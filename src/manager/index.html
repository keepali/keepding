<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkding Offline - 书签管理面板</title>
  <link rel="stylesheet" href="./manager.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- Logo & Title -->
      <div class="flex items-center space-x-3 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-base shadow-sm">
          L
        </div>
        <div>
          <span class="font-bold text-slate-900 text-base tracking-tight">Linkding</span>
          <span class="text-xs bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-medium ml-1.5">纯离线</span>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-2xl relative">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input
            type="text"
            id="search-input"
            class="block w-full pl-9 pr-16 py-2 border border-slate-300 rounded-lg bg-slate-50 text-sm placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all"
            placeholder="搜索书签、笔记、网址... (支持 #标签 !unread site:域名)"
          >
          <div class="absolute inset-y-0 right-0 pr-2 flex items-center space-x-1">
            <button id="btn-clear-search" class="hidden text-slate-400 hover:text-slate-600 p-1 rounded-md text-xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
            <span class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-semibold text-slate-400 bg-slate-200 rounded border border-slate-300">/</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center space-x-2 shrink-0">
        <button
          id="btn-open-add-modal"
          class="inline-flex items-center px-3.5 py-2 border border-transparent text-xs font-semibold rounded-lg shadow-xs text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 transition-colors gap-1.5"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span>添加书签</span>
        </button>

        <button
          id="btn-open-io-modal"
          class="inline-flex items-center px-3 py-2 border border-slate-300 text-xs font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition-colors gap-1.5 shadow-xs"
        >
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span>导入/导出</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 flex gap-8">
    <!-- Left Sidebar -->
    <aside class="w-64 shrink-0 hidden md:block space-y-6">
      <!-- Views Filter -->
      <nav class="space-y-1">
        <button
          data-filter="all"
          class="sidebar-nav-item active w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg text-slate-900 bg-emerald-50 text-emerald-800 transition-colors"
        >
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
            <span>全部书签</span>
          </div>
          <span id="count-all" class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-semibold">0</span>
        </button>

        <button
          data-filter="unread"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition-colors"
        >
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>稍后阅读</span>
          </div>
          <span id="count-unread" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-semibold">0</span>
        </button>

        <button
          data-filter="archived"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition-colors"
        >
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
            </svg>
            <span>归档箱</span>
          </div>
          <span id="count-archived" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-semibold">0</span>
        </button>
      </nav>

      <!-- Tags Section -->
      <div class="border-t border-slate-200 pt-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">标签分类 (Tags)</h3>
          <button id="btn-clear-tags" class="hidden text-xs text-blue-600 hover:text-blue-800">清除筛选</button>
        </div>
        <div id="tags-list" class="space-y-1 max-h-[calc(100vh-320px)] overflow-y-auto pr-1">
          <div class="text-xs text-slate-400 italic py-2">暂无标签</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0">
      <!-- Content Header Bar -->
      <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-200 mb-5">
        <div class="flex items-center gap-3">
          <h2 id="view-title" class="text-lg font-bold text-slate-800">全部书签</h2>
          <span id="view-count" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">0 条</span>
        </div>

        <!-- Active tag filters pills -->
        <div id="active-tag-pills" class="flex flex-wrap gap-1.5 flex-1 max-w-md"></div>

        <!-- Sort dropdown -->
        <div class="flex items-center space-x-2">
          <label for="sort-select" class="text-xs text-slate-500 font-medium">排序:</label>
          <select id="sort-select" class="text-xs bg-white border border-slate-300 rounded-md px-2.5 py-1.5 text-slate-700 focus:outline-none focus:ring-1 focus:ring-emerald-500">
            <option value="date_desc">最新添加</option>
            <option value="date_asc">最早添加</option>
            <option value="title_asc">标题 (A-Z)</option>
          </select>
        </div>
      </div>

      <!-- Bookmarks List -->
      <div id="bookmarks-container" class="space-y-3">
        <!-- Bookmark items will be rendered here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl border border-dashed border-slate-300">
        <div class="w-12 h-12 mx-auto mb-3 text-slate-300">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <h3 class="text-sm font-semibold text-slate-700 mb-1">未找到任何书签</h3>
        <p class="text-xs text-slate-500 max-w-sm mx-auto mb-4">您可以点击右上角“添加书签”或者“导入/导出”从现有的 Chrome 书签或 JSON 文件恢复。</p>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div id="bookmark-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
        <h3 id="modal-title" class="font-bold text-slate-800 text-base">添加书签</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="modal-form" class="p-6 overflow-y-auto space-y-4 flex-1">
        <input type="hidden" id="modal-id">

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="modal-url">网址 URL *</label>
          <input type="url" id="modal-url" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="https://example.com">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="modal-bm-title">标题 Title *</label>
          <input type="text" id="modal-bm-title" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="页面标题">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="modal-desc">简短描述 Description (可选)</label>
          <textarea id="modal-desc" rows="2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-none" placeholder="关于该网站的简短摘要..."></textarea>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-semibold text-slate-700" for="modal-notes">Notes 笔记 (支持 Markdown)</label>
            <button type="button" id="modal-toggle-preview" class="text-xs text-blue-600 hover:text-blue-800">
              预览效果
            </button>
          </div>
          <div id="modal-notes-edit">
            <textarea id="modal-notes" rows="4" class="w-full px-3 py-2 text-sm font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="写下你的想法、备忘、代码片段..."></textarea>
          </div>
          <div id="modal-notes-preview" class="hidden p-3 max-h-48 overflow-y-auto bg-slate-50 border border-slate-300 rounded-lg text-sm markdown-body"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1" for="modal-tags">标签 Tags (空格或逗号分隔)</label>
          <input type="text" id="modal-tags" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="dev, tools, reading">
          <div id="modal-tag-suggestions" class="flex flex-wrap gap-1.5 mt-2"></div>
        </div>

        <div class="flex items-center space-x-6 pt-1">
          <label class="flex items-center space-x-2 text-sm text-slate-700 cursor-pointer">
            <input type="checkbox" id="modal-unread" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4">
            <span>标记为稍后阅读 (Unread)</span>
          </label>
          <label class="flex items-center space-x-2 text-sm text-slate-700 cursor-pointer">
            <input type="checkbox" id="modal-archived" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4">
            <span>归档 (Archived)</span>
          </label>
        </div>

        <div class="pt-4 border-t border-slate-200 flex items-center justify-end space-x-3">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">
            取消
          </button>
          <button type="submit" id="btn-submit-modal" class="px-5 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 rounded-lg shadow-xs transition-colors">
            保存
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Import / Export Modal -->
  <div id="io-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
        <h3 class="font-bold text-slate-800 text-base">导入与导出数据</h3>
        <button id="btn-close-io" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6">
        <!-- Export Section -->
        <div>
          <h4 class="text-sm font-bold text-slate-800 mb-1.5 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            导出书签 (Export)
          </h4>
          <p class="text-xs text-slate-500 mb-3">备份您的本地数据，不受任何云端限制。</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button id="btn-export-json" class="p-3 border border-slate-200 hover:border-emerald-500 rounded-lg text-left hover:bg-emerald-50/40 transition-all">
              <div class="font-semibold text-xs text-slate-800">全量 JSON 备份</div>
              <div class="text-[11px] text-slate-500 mt-1">包含所有书签、完整 Notes、标签、阅读状态等</div>
            </button>
            <button id="btn-export-html" class="p-3 border border-slate-200 hover:border-emerald-500 rounded-lg text-left hover:bg-emerald-50/40 transition-all">
              <div class="font-semibold text-xs text-slate-800">Netscape HTML 书签</div>
              <div class="text-[11px] text-slate-500 mt-1">兼容 Chrome/Firefox 书签、Pocket、Raindrop、Linkding</div>
            </button>
          </div>
        </div>

        <div class="border-t border-slate-200"></div>

        <!-- Import Section -->
        <div>
          <h4 class="text-sm font-bold text-slate-800 mb-1.5 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            导入书签 (Import)
          </h4>
          <p class="text-xs text-slate-500 mb-3">支持从浏览器导出的书签 HTML 文件，或本插件导出的 JSON 备份恢复。</p>

          <div class="space-y-3">
            <div class="flex items-center space-x-2">
              <input type="checkbox" id="import-overwrite" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4">
              <label for="import-overwrite" class="text-xs text-slate-700 cursor-pointer">遇到相同网址时覆盖更新已存数据（默认跳过）</label>
            </div>

            <!-- Upload Area -->
            <div class="border-2 border-dashed border-slate-300 hover:border-emerald-500 rounded-lg p-6 text-center transition-colors cursor-pointer bg-slate-50" id="drop-zone">
              <input type="file" id="file-import" accept=".json,.html,.htm" class="hidden">
              <svg class="w-8 h-8 mx-auto text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
              </svg>
              <div class="text-xs font-semibold text-slate-700 mb-0.5">点击选择文件 或 将文件拖入此处</div>
              <div class="text-[11px] text-slate-400">支持 .json 或 .html 书签文件</div>
            </div>

            <!-- Import status feedback -->
            <div id="import-result" class="hidden p-3 rounded-lg text-xs"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden px-4 py-2.5 rounded-lg shadow-lg text-xs font-medium text-white transition-all transform duration-200"></div>

  <script type="module" src="./manager.ts"></script>
</body>
</html>
