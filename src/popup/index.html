<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinscribe</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body class="p-4 select-none">
  <!-- Top Header -->
  <div class="flex items-center justify-between pb-3 border-b border-slate-200">
    <div class="flex items-center space-x-2">
      <div class="w-6 h-6 rounded bg-emerald-600 flex items-center justify-center text-white font-bold text-xs shadow-sm">
        L
      </div>
      <h1 class="font-bold text-slate-800 text-sm">Pinscribe <span class="text-xs font-normal text-slate-500">离线版</span></h1>
      <span id="status-badge" class="hidden px-2 py-0.5 text-xs font-medium rounded-full bg-blue-100 text-blue-800">
        已收藏
      </span>
    </div>
    <div class="flex items-center space-x-1">
      <button id="btn-open-manager" title="打开全屏管理面板" class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded transition-colors text-xs flex items-center gap-1 font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
        管理面板
      </button>
    </div>
  </div>

  <!-- Alert Banner -->
  <div id="alert-banner" class="hidden my-2 p-2 rounded text-xs"></div>

  <!-- Form -->
  <form id="bookmark-form" class="mt-3 space-y-3">
    <input type="hidden" id="bookmark-id">

    <!-- URL -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="url">网址 URL</label>
      <input type="url" id="url" required class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded focus:bg-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
    </div>

    <!-- Title -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="title">标题 Title</label>
      <input type="text" id="title" required class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
    </div>

    <!-- Description -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="description">描述 Description (可选)</label>
      <textarea id="description" rows="2" class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-none" placeholder="关于该页面的简短摘要..."></textarea>
    </div>

    <!-- Notes (Markdown) -->
    <div>
      <div class="flex items-center justify-between mb-1">
        <label class="text-xs font-semibold text-slate-600" for="notes">Notes 笔记 (支持 Markdown)</label>
        <button type="button" id="btn-toggle-notes-preview" class="text-xs text-blue-600 hover:text-blue-800 underline">
          预览
        </button>
      </div>
      <div id="notes-edit-container">
        <textarea id="notes" rows="3" class="w-full px-2.5 py-1.5 text-xs font-mono bg-white border border-slate-300 rounded focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="支持 Markdown、代码段、检查清单..."></textarea>
      </div>
      <div id="notes-preview-container" class="hidden w-full p-2.5 max-h-28 overflow-y-auto bg-slate-50 border border-slate-300 rounded text-xs markdown-body"></div>
    </div>

    <!-- Tags -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="tags-input">标签 Tags (空格或逗号分隔)</label>
      <input type="text" id="tags-input" class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="例如: dev, react, tools">
      <!-- Tag suggestions -->
      <div id="tag-suggestions" class="flex flex-wrap gap-1 mt-1.5"></div>
    </div>

    <!-- Checkboxes -->
    <div class="flex items-center justify-between pt-1">
      <label class="flex items-center space-x-2 text-xs text-slate-700 cursor-pointer">
        <input type="checkbox" id="unread" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-3.5 h-3.5">
        <span>标记为稍后阅读 (Unread)</span>
      </label>
      <label class="flex items-center space-x-2 text-xs text-slate-700 cursor-pointer">
        <input type="checkbox" id="archived" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-3.5 h-3.5">
        <span>归档 (Archived)</span>
      </label>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-between pt-2 border-t border-slate-200">
      <div>
        <button type="button" id="btn-delete" class="hidden text-xs text-red-600 hover:text-red-700 font-medium px-2 py-1.5 rounded hover:bg-red-50 transition-colors">
          删除收藏
        </button>
      </div>
      <div class="flex items-center space-x-2">
        <span class="text-[10px] text-slate-400">Ctrl+Enter 保存</span>
        <button type="submit" id="btn-save" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium text-xs rounded shadow-sm transition-colors flex items-center gap-1">
          <span>保存书签</span>
        </button>
      </div>
    </div>
  </form>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
